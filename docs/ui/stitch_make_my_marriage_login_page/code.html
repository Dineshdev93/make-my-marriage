":"#fff8f2","on-tertiary-fixed":"#041d2f","tertiary-fixed-dim":"#b2c9e0","surface-container-highest":"#e7e2db","primary":"#4e051f"},"borderRadius":{"DEFAULT":"0.25rem","lg":"0.5rem","xl":"0.75rem","full":"9999px"},"spacing":{"gutter":"1.5rem","space-xl":"2.5rem","space-sm":"0.5rem","space-lg":"1.5rem","margin-mobile":"1.25rem","margin":"2.5rem","space-xs":"0.25rem","space-md":"1rem","gutter-mobile":"1rem"},"fontFamily":{"headline-lg-mobile":["Newsreader"],"display-lg":["Newsreader"],"display-lg-mobile":["Newsreader"],"body-md":["Inter"],"label-sm":["Inter"],"headline-lg":["Newsreader"],"body-lg":["Inter"],"numeral-display":["Newsreader"],"label-md":["Inter"],"numeral-display-mobile":["Newsreader"],"headline-md":["Newsreader"],"headline-sm":["Newsreader"],"body-sm":["Inter"]},"fontSize":{"headline-lg-mobile":["28px",{"lineHeight":"34px","letterSpacing":"-0.01em","fontWeight":"400"}],"display-lg":["52px",{"lineHeight":"60px","letterSpacing":"-0.02em","fontWeight":"400"}],"display-lg-mobile":["36px",{"lineHeight":"42px","letterSpacing":"-0.015em","fontWeight":"400"}],"body-md":["14px",{"lineHeight":"22px","letterSpacing":"0em","fontWeight":"400"}],"label-sm":["11px",{"lineHeight":"16px","letterSpacing":"0.06em","fontWeight":"500"}],"headline-lg":["38px",{"lineHeight":"46px","letterSpacing":"-0.015em","fontWeight":"400"}],"body-lg":["16px",{"lineHeight":"26px","letterSpacing":"0em","fontWeight":"400"}],"numeral-display":["44px",{"lineHeight":"48px","letterSpacing":"-0.02em","fontWeight":"300"}],"label-md":["13px",{"lineHeight":"18px","letterSpacing":"0.04em","fontWeight":"500"}],"numeral-display-mobile":["32px",{"lineHeight":"36px","letterSpacing":"-0.01em","fontWeight":"300"}],"headline-md":["28px",{"lineHeight":"36px","letterSpacing":"-0.01em","fontWeight":"400"}],"headline-sm":["22px",{"lineHeight":"30px","letterSpacing":"-0.005em","fontWeight":"400"}],"body-sm":["12px",{"lineHeight":"18px","letterSpacing":"0.01em","fontWeight":"400"}]}}}};</script></head><body class="min-h-screen bg-page-bg text-text-charcoal selection:bg-primary-fixed selection:text-on-primary-fixed"><div class="min-h-screen flex flex-col lg:flex-row w-full"><section class="hidden lg:flex lg:w-[40%] bg-band-cta text-primary-contrast flex-col justify-between p-margin relative overflow-hidden select-none"><div class="flex items-center gap-space-sm"><svg class="w-8 h-8 text-primary-contrast stroke-current" fill="none" stroke-width="1.5" viewbox="0 0 36 24"><circle cx="13" cy="12" fill="none" r="9"></circle><circle cx="23" cy="12" fill="none" r="9"></circle></svg><span class="font-headline-sm text-headline-sm tracking-tight text-primary-contrast">Make My Marriage</span></div><div class="my-auto max-w-sm"><p class="font-headline-lg text-headline-lg text-primary-contrast leading-snug">Every function. Every rupee. One calm place.</p><div class="mt-space-lg w-12 h-px bg-border-hairline/30"></div></div><div class="text-border-hairline font-label-sm text-label-sm uppercase tracking-wider">© Make My Marriage. All rights reserved.</div></section><section class="w-full lg:w-[60%] bg-page-bg flex flex-col justify-center items-center px-margin-mobile py-space-xl lg:px-margin"><div class="lg:hidden flex items-center justify-center gap-space-sm mb-space-xl"><svg class="w-7 h-7 text-band-cta stroke-current" fill="none" stroke-width="1.5" viewbox="0 0 36 24"><circle cx="13" cy="12" fill="none" r="9"></circle><circle cx="23" cy="12" fill="none" r="9"></circle></svg><span class="font-headline-sm text-headline-sm tracking-tight text-band-cta">Make My Marriage</span></div><main class="w-full max-w-[420px] mx-auto"><div class="flex flex-col w-full">
<div class="w-full bg-surface-raised border border-border-hairline rounded-[16px] p-8 md:p-10 shadow-[0_4px_24px_-4px_rgba(35,33,29,0.04)]">
<!-- Header -->
<header class="mb-8">
<h1 class="font-headline-md text-headline-md text-text-charcoal font-normal tracking-tight">
        Welcome back
      </h1>
<p class="font-body-md text-body-md text-text-muted mt-space-xs">
        Enter your details to view your wedding plans.
      </p>
</header>
<!-- Form -->
<form class="flex flex-col space-y-5" id="login-form" onsubmit="event.preventDefault(); handleLoginSubmit();">
<!-- Email Field -->
<div class="flex flex-col space-y-1.5">
<label class="font-label-md text-label-md text-text-charcoal font-medium" for="email">
          Email
        </label>
<div class="relative">
<input autocomplete="email" class="w-full h-11 px-3.5 bg-surface-raised border border-border-hairline rounded-[10px] text-text-charcoal font-body-md text-body-md placeholder:text-text-muted/65 focus:outline-none focus:border-error-wine focus:ring-1 focus:ring-error-wine transition-colors duration-150" id="email" name="email" placeholder="meera@example.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col space-y-1.5">
<div class="flex items-center justify-between">
<label class="font-label-md text-label-md text-text-charcoal font-medium" for="password">
            Password
          </label>
<a class="font-label-sm text-label-sm text-error-wine hover:text-primary-hover underline underline-offset-[3px] transition-colors" href="#forgot-password">
            Forgot password?
          </a>
</div>
<div class="relative">
<input autocomplete="current-password" class="w-full h-11 pl-3.5 pr-11 bg-surface-raised border border-border-hairline rounded-[10px] text-text-charcoal font-body-md text-body-md placeholder:text-text-muted/65 focus:outline-none focus:border-error-wine focus:ring-1 focus:ring-error-wine transition-colors duration-150 tracking-wider" id="password" name="password" placeholder="••••••••••••" required="" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-0 top-0 bottom-0 px-3.5 flex items-center justify-center text-text-muted hover:text-text-charcoal transition-colors cursor-pointer select-none" id="toggle-password" onclick="togglePasswordVisibility()" type="button">
<span class="material-symbols-outlined text-[19px]" id="eye-icon">visibility</span>
</button>
</div>
</div>
<!-- Remember Me (Editorial Minimal) -->
<div class="flex items-center space-x-2 pt-1">
<input class="w-[18px] h-[18px] rounded-[4px] border-border-hairline bg-surface-raised accent-error-wine text-error-wine focus:ring-0 focus:outline-none cursor-pointer" id="remember-me" name="remember-me" type="checkbox"/>
<label class="font-body-sm text-body-sm text-text-muted cursor-pointer select-none" for="remember-me">
          Keep me signed in on this device
        </label>
</div>
<!-- Status Indicator (Hidden by default, shown via JS) -->
<div class="hidden p-3 rounded-[10px] font-body-sm text-body-sm flex items-center gap-2" id="status-banner">
<span class="material-symbols-outlined text-[16px]">info</span>
<span id="status-message"></span>
</div>
<!-- Primary Action -->
<div class="pt-2">
<button class="w-full h-11 bg-error-wine hover:bg-primary-hover text-primary-contrast rounded-[10px] font-label-md text-label-md tracking-wide transition-colors duration-150 flex items-center justify-center cursor-pointer shadow-sm active:scale-[0.99]" id="submit-btn" type="submit">
<span id="btn-label">Log in</span>
<span class="hidden ml-2 inline-block w-4 h-4 border-2 border-primary-contrast border-t-transparent rounded-full animate-spin" id="btn-spinner"></span>
</button>
</div>
</form>
<!-- Footer Switcher -->
<div class="mt-8 pt-6 border-t border-border-hairline text-center">
<p class="font-body-md text-body-md text-text-muted">
        New here? 
        <a class="text-error-wine hover:text-primary-hover font-medium underline underline-offset-[3px] ml-1 transition-colors" href="#signup">
          Start planning
        </a>
</p>
</div>
<!-- Editorial Trust Marker -->
<div class="mt-6 flex items-center justify-center gap-2 text-text-muted/60 font-label-sm text-label-sm uppercase tracking-widest text-[10px]">
<span>Private & Encrypted</span>
<span>•</span>
<span>Delhi • Mumbai • Bengaluru</span>
</div>
</div>
</div>
<script>
  function togglePasswordVisibility() {
    const passwordInput = document.getElementById('password');
    const eyeIcon = document.getElementById('eye-icon');
    
    if (passwordInput.type === 'password') {
      passwordInput.type = 'text';
      passwordInput.classList.remove('tracking-wider');
      eyeIcon.textContent = 'visibility_off';
    } else {
      passwordInput.type = 'password';
      passwordInput.classList.add('tracking-wider');
      eyeIcon.textContent = 'visibility';
    }
  }

  function handleLoginSubmit() {
    const submitBtn = document.getElementById('submit-btn');
    const btnLabel = document.getElementById('btn-label');
    const btnSpinner = document.getElementById('btn-spinner');
    const statusBanner = document.getElementById('status-banner');
    const statusMsg = document.getElementById('status-message');

    // Simulate authenticating
    btnLabel.textContent = 'Verifying...';
    btnSpinner.classList.remove('hidden');
    submitBtn.disabled = true;
    submitBtn.classList.add('opacity-90');

    setTimeout(() => {
      btnLabel.textContent = 'Log in';
      btnSpinner.classList.add('hidden');
      submitBtn.disabled = false;
      submitBtn.classList.remove('opacity-90');

      // Feedback display
      statusBanner.className = 'p-3 rounded-[10px] font-body-sm text-body-sm flex items-center gap-2 bg-accent-info/10 text-accent-info border border-accent-info/20';
      statusMsg.textContent = 'Verification link sent to your registered address.';
      statusBanner.classList.remove('hidden');
    }, 1100);
  }
</script></main></section></div></body></html>
