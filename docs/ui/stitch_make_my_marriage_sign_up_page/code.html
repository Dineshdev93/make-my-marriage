="min-h-screen bg-page-bg text-text-charcoal selection:bg-primary-fixed selection:text-on-primary-fixed"><div class="min-h-screen flex flex-col lg:flex-row w-full"><section class="hidden lg:flex lg:w-[40%] bg-band-cta text-primary-contrast flex-col justify-between p-margin relative overflow-hidden select-none"><div class="flex items-center gap-space-sm"><svg class="w-8 h-8 text-primary-contrast stroke-current" fill="none" stroke-width="1.5" viewbox="0 0 36 24"><circle cx="13" cy="12" fill="none" r="9"></circle><circle cx="23" cy="12" fill="none" r="9"></circle></svg><span class="font-headline-sm text-headline-sm tracking-tight text-primary-contrast">Make My Marriage</span></div><div class="my-auto max-w-sm"><p class="font-headline-lg text-headline-lg text-primary-contrast leading-snug">Every function. Every rupee. One calm place.</p><div class="mt-space-lg w-12 h-px bg-border-hairline/30"></div></div><div class="text-border-hairline font-label-sm text-label-sm uppercase tracking-wider">© Make My Marriage. All rights reserved.</div></section><section class="w-full lg:w-[60%] bg-page-bg flex flex-col justify-center items-center px-margin-mobile py-space-xl lg:px-margin"><div class="lg:hidden flex items-center justify-center gap-space-sm mb-space-xl"><svg class="w-7 h-7 text-band-cta stroke-current" fill="none" stroke-width="1.5" viewbox="0 0 36 24"><circle cx="13" cy="12" fill="none" r="9"></circle><circle cx="23" cy="12" fill="none" r="9"></circle></svg><span class="font-headline-sm text-headline-sm tracking-tight text-band-cta">Make My Marriage</span></div><main class="w-full max-w-[420px] mx-auto"><div class="flex flex-col w-full">
<div class="w-full bg-surface-raised rounded-xl shadow-sm p-6 sm:p-8">
<div class="mb-space-lg">
<h1 class="font-headline-md text-headline-md text-text-charcoal tracking-tight font-normal">
        Create your account
      </h1>
<p class="font-body-md text-body-md text-text-muted mt-space-xs">
        Free to use. Takes a minute.
      </p>
</div>
<form class="flex flex-col space-y-space-md" onsubmit="event.preventDefault();">
<div class="flex flex-col">
<label class="font-label-md text-label-md text-text-charcoal mb-space-xs" for="full-name">
          Full name
        </label>
<input autocomplete="name" class="w-full h-11 px-space-md bg-surface-raised text-text-charcoal placeholder:text-text-muted/65 font-body-md text-body-md rounded-[10px] focus:outline-none focus:bg-surface-raised transition-colors" id="full-name" name="full-name" onblur="this.style.boxShadow='inset 0 0 0 1px #DDD6CA'" onfocus="this.style.boxShadow='inset 0 0 0 1px #6B1D34'" placeholder="Meera Sharma" required="" style="box-shadow: inset 0 0 0 1px #DDD6CA;" type="text"/>
</div>
<div class="flex flex-col">
<label class="font-label-md text-label-md text-text-charcoal mb-space-xs" for="email-address">
          Email
        </label>
<input autocomplete="email" class="w-full h-11 px-space-md bg-surface-raised text-text-charcoal placeholder:text-text-muted/65 font-body-md text-body-md rounded-[10px] focus:outline-none focus:bg-surface-raised transition-colors" id="email-address" name="email-address" onblur="this.style.boxShadow='inset 0 0 0 1px #DDD6CA'" onfocus="this.style.boxShadow='inset 0 0 0 1px #6B1D34'" placeholder="meera@example.com" required="" style="box-shadow: inset 0 0 0 1px #DDD6CA;" type="email"/>
</div>
<div class="flex flex-col">
<label class="font-label-md text-label-md text-text-charcoal mb-space-xs" for="user-password">
          Password
        </label>
<div class="relative w-full">
<input autocomplete="new-password" class="w-full h-11 pl-space-md pr-11 bg-surface-raised text-text-charcoal placeholder:text-text-muted/65 font-body-md text-body-md rounded-[10px] focus:outline-none focus:bg-surface-raised transition-colors tracking-widest placeholder:tracking-normal" id="user-password" name="user-password" onblur="this.style.boxShadow='inset 0 0 0 1px #DDD6CA'" onfocus="this.style.boxShadow='inset 0 0 0 1px #6B1D34'" placeholder="••••••••" required="" style="box-shadow: inset 0 0 0 1px #DDD6CA;" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-0 top-0 h-11 w-11 flex items-center justify-center text-text-muted hover:text-text-charcoal focus:outline-none transition-colors" id="toggle-password" type="button">
<span class="material-symbols-outlined text-[19px]" id="eye-icon">visibility</span>
</button>
</div>
<span class="font-body-sm text-body-sm text-text-muted mt-space-xs">
          At least 8 characters
        </span>
</div>
<div class="pt-space-xs">
<button class="w-full h-11 bg-error-wine hover:bg-primary-hover text-primary-contrast font-label-md text-label-md rounded-[10px] transition-colors focus:outline-none" type="submit">
          Create account
        </button>
</div>
</form>
<div class="mt-space-lg text-center">
<p class="font-body-md text-body-md text-text-muted">

          Log in
        </a>
</p>
</div>
</div>
<div class="mt-space-lg flex items-center justify-between px-space-xs text-text-muted font-label-sm text-label-sm">
<span>Private & secure</span>
<span class="inline-block w-1 h-1 rounded-full bg-border-hairline"></span>
<span>Encrypted data</span>
<span class="inline-block w-1 h-1 rounded-full bg-border-hairline"></span>
<span>No spam</span>
</div>
</div>
<script>
  (function() {
    const passwordInput = document.getElementById('user-password');
    const toggleButton = document.getElementById('toggle-password');
    const eyeIcon = document.getElementById('eye-icon');

    if (toggleButton && passwordInput && eyeIcon) {
      toggleButton.addEventListener('click', function() {
        const isPassword = passwordInput.getAttribute('type') === 'password';
        passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
        eyeIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
        if (isPassword) {
          passwordInput.classList.remove('tracking-widest');
        } else {
          passwordInput.classList.add('tracking-widest');
        }
      });
    }
  })();
</script></main></section></div></body></html>
